# The services, in the order the home page lists them. One list drives the
# home services section, the hero planets, the footer, the contact form's
# "What do you need?" options, llms.txt and the "Need" line main.rb adds to
# contact emails, so a change here shows up everywhere.
#
# id:         home page anchor (#code-audit) and the form's `need` value
# home:       listed in the home services section (with summary and cta)
# planet:     hero planet; orbit 1 is innermost (the shortest engagement) and
#             orbit 6 outermost (ongoing work). Sizes and start angles are in
#             _frontend/javascripts/home/orbit.js, keyed by orbit.
# footer:     label in the footer's Services column (omit to leave it out)
# need:       label of the contact form option (omit for no option). The form
#             on the service's own page sends it without asking
# own_page:   leave the option off the forms that ask (its own page still
#             sends it)
# conversion: Google Ads conversion sent when a form on this service's page
#             is sent

- id: ai-integration
  url: /ai-integration/
  name: AI integration
  home: true
  summary: Add AI to your existing app without rebuilding it, like chat over your app's own data using the Claude API with tool calling.
  cta: Add AI to your app
  planet: { label: Add AI, sub: AI integration, orbit: 3 }
  footer: AI integration
  need: AI integration

- id: project-rescue
  url: /app-rescue/
  name: Software project rescue
  home: true
  summary: Your app is outdated or fragile, or your last developer disappeared. We take it over, stabilize it, and modernize the legacy code that is holding your business back.
  cta: How a rescue works
  planet: { label: Rescue it, sub: Project rescue, orbit: 5 }
  footer: Software project rescue
  need: Project rescue

- id: vibe-coding-cleanup
