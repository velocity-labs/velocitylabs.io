# Portfolio projects. A project with a slug gets a card on /portfolio/, in the
# order listed here: its image (or a typeset cover for work with no screen to
# show), summary and technologies. The home page (index.html) and service pages
# (blocks/work-band.html) pick cards by slug. Projects without a slug are listed
# alphabetically under "Earlier work". Technology pills link to
# /portfolio/?tech=<slug>, which shows the cards that use it.

- slug: princess-dental-staffing
  title: Princess Dental Staffing
  summary: Dental practices use it to hire staff and book temps online. Along the way we built its Stripe subscriptions, the API behind its mobile app, and AI-based matching, as it grew from one local market to nationwide.
  technologies: [Ruby on Rails, PostgreSQL, Stripe, Mistral, Twilio, SendGrid, Solr, Amazon S3, Amazon CloudFront, Heroku]
  image: { src: /images/work/princess-dental-staffing.webp, width: 1240, height: 2000, alt: "Princess Dental Staffing home page: Make your next hire with Princess" }
  feature:
    heading: The dental staffing app we rebuilt in 2015 has placed 200,000 temps. We still work on it.
    numbers:
      - { value: "~$90M", label: earned by candidates }
      - { value: "10+", label: years as their development team }

- slug: land-surveying-firm
  title: Land surveying firm
  summary: We audited this firm's job and invoicing app, fixed the three urgent issues we found, rebuilt its invoice engine, upgraded Rails, and still look after it.
  technologies: [Ruby on Rails, PostgreSQL, RSpec]
  image: { src: /images/work/land-surveying-firm.webp, width: 1000, height: 625, alt: "The surveying firm's daily workflow screen, listing the day's work orders" }

- slug: registria
  title: Registria
  summary: Product registration data for consumer brands. We're the largest contributor to the job platform behind their clients' scheduled reports and data deliveries.
  technologies: [Ruby on Rails, PostgreSQL, Alteryx, Claude Code]
  cover: { kicker: Since April 2026, line: "Alteryx workflows, rebuilt in Rails.", sub: "Reports and data deliveries across US, EU and Australian regions" }

- slug: flashdrafts
  title: Recall software for auto shops
  summary: "We added the paywall and all of its Stripe billing in about three weeks: per-seat monthly and annual plans, sales tax, and promo codes."
  technologies: [Ruby on Rails, Stripe]
  image: { src: /images/work/flashdrafts.webp, width: 1000, height: 625, alt: "FlashDrafts home page: every open recall, every remedy, in one place" }

- slug: goalistics
  title: Goalistics
  summary: Online programs for chronic pain and depression, built for a team of psychologists. We've been their development team since 2014.
  technologies: [Ruby on Rails, PostgreSQL, Heroku]
  image: { src: /images/work/goalistics.webp, width: 1000, height: 625, alt: "Goalistics home page: goal-based behavior change for depression and chronic pain" }

- slug: go-swim
  title: Go Swim
  summary: "A swim instruction video site we took over after launch and developed for six years: subscriptions, payments, and video delivery."
  technologies: [Ruby on Rails, Stripe, Vimeo, Amazon CloudFront]
  image: { src: /images/work/go-swim.webp, width: 1000, height: 625, alt: "Go Swim home page: videos to inspire, educate and make you a better swimmer" }

- slug: valley-metro
  title: Valley Metro
  summary: "Rider tools for the Phoenix area's transit agency, which we built and ran: an online trip planner, timetables, service alerts, a mobile site, and a real-time light rail feed."
  technologies: [Ruby on Rails, SOAP]
  image: { src: /images/work/valley-metro.webp, width: 1000, height: 625, alt: "Valley Metro's home page, with its transit trip planner" }

- slug: tap-inspect
  title: Tap Inspect
  summary: Home inspection software. We joined their engineering team to move a large legacy app to a new architecture, adding team accounts and an API for their mobile app.
  technologies: [Ruby on Rails, PostgreSQL]
  image: { src: /images/work/tap-inspect.webp, width: 1000, height: 625, alt: "Tap Inspect's home page: We help home inspectors save 1-2 hours per inspection" }

