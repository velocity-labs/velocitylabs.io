# Portfolio projects. Newer projects carry a slug, summary, technologies and an
# image (or a typeset cover); the home page picks its featured project and
# cases by slug in index.html. Technology pills link to /portfolio/?tech=<slug>.
# portfolio: false keeps a project off /portfolio/ (until it is rebuilt).

- slug: land-surveying-firm
  title: Land surveying firm
  summary: We audited this firm's job and invoicing app, fixed the three urgent issues we found, rebuilt its invoice engine, upgraded Rails, and still look after it.
  technologies: [Ruby on Rails, PostgreSQL, RSpec]
  image: { src: /images/work/land-surveying-firm.webp, width: 1000, height: 625, alt: "The surveying firm's daily workflow screen, listing the day's work orders" }
  portfolio: false

- slug: registria
  title: Registria
  summary: Product registration data for consumer brands. We're the largest contributor to the job platform behind their clients' scheduled reports and data deliveries.
  technologies: [Ruby on Rails, PostgreSQL, Alteryx, Claude Code]
  cover: { kicker: Since April 2026, line: "Alteryx workflows, rebuilt in Rails.", sub: "Reports and data deliveries across US, EU and Australian regions" }
  portfolio: false

- slug: flashdrafts
  title: Recall software for auto shops
  summary: "We added the paywall and all of its Stripe billing in about three weeks: per-seat monthly and annual plans, sales tax, and promo codes."
  technologies: [Ruby on Rails, Stripe]
  image: { src: /images/work/flashdrafts.webp, width: 1000, height: 625, alt: "FlashDrafts home page: every open recall, every remedy, in one place" }
  portfolio: false

