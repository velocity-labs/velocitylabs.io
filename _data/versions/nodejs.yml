# release schedule (github.com/nodejs/Release schedule.json), and
# nodejs.org/dist/index.json for the latest LTS release. Even-numbered lines only:
# Active LTS (bug fixes) runs about a year, then Maintenance (security fixes)
# until the end-of-life date. Odd-numbered lines are never LTS.
