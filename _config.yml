# Where things are
source:      .
destination: ./_site
plugins_dir: ./_plugins
layouts_dir: ./_layouts
data_dir:    ./_data
collections: null

# Handling Reading
safe:         false
include:      [".htaccess", ".well-known"]
exclude:      ['config.ru', 'Gemfile', 'Gemfile.lock', 'vendor', 'README.md', 'Rakefile', 'Procfile.dev', 'unicorn-dev.rb', 'LICENSE', 'CNAME', 'node_modules', 'package.json', 'package-lock.json', 'vite.config.mjs', 'docs', 'public', '.jekyll-cache', 'thoughts', 'prototype.html', 'main.rb', 'CLAUDE.md', 'DEV_README.md', 'Procfile', 'yarn.lock', 'static.json', 'config', 'bin', 'test', 'tmp']
keep_files:   [".git", ".svn"]
encoding:     "utf-8"

# Filtering Content
show_drafts: null
limit_posts: 0
future:      false
unpublished: false

# Plugins
whitelist: []
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll/vite

# Conversion
markdown:     kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
highlighter:  rouge
lsi:          false
excerpt_separator: "\n\n"

# Serving
detach:  false
port:    4000
host:    127.0.0.1
baseurl: "" # does not include hostname
url:     https://velocitylabs.io

# Outputting
permalink:     /blog/:year/:month/:day/:title/
paginate_path: /blog/:num
paginate:      10
timezone:      null

quiet:    false
defaults: []

# Markdown Processors
kramdown:
  auto_ids:       true
  footnote_nr:    1
  entity_output:  as_char
  toc_levels:     1..6
  smart_quotes:   lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge

minfy_html: true

