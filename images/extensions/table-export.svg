<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Table Export icon: a table whose header row is filled with the extension's blue,
       ruled off from the body by a light line. Straight edges sit on a 4-unit grid so they
       land on whole pixels at 128, 64 and 32px. -->
  <rect width="64" height="64" rx="14" fill="#213247"/>
  <path d="M14 14 H50 V24 H14 Z" fill="#4c8dff"/>
  <rect x="12" y="12" width="40" height="40" rx="4" fill="none" stroke="#eef2f7" stroke-width="4"/>
  <path d="M12 24 H52 M12 38 H52 M32 24 V52" stroke="#eef2f7" stroke-width="4"/>
</svg>
