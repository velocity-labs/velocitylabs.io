<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Word Count icon: the panel's reading-progress ring, in the extension's green,
       around lines of text. The text lines sit on a 4-unit grid so they land on whole
       pixels at 128, 64 and 32px. -->
  <rect width="64" height="64" rx="14" fill="#213247"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#eef2f7" stroke-opacity="0.25" stroke-width="6"/>
  <path d="M32 12 A20 20 0 1 1 12 32" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round"/>
  <path d="M25 26 H39 M25 32 H39 M25 38 H33" stroke="#eef2f7" stroke-width="4" stroke-linecap="round"/>
</svg>
