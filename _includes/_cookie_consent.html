<div class="cookie-consent" id="cookie-consent" role="region" aria-label="Cookie consent" hidden>
  <div class="container">
    <p>
      <span data-cookie-message>
        We use cookies to understand how visitors use our site and to measure our advertising.
        You can accept or decline them; the site works the same either way.
      </span>
      <a href="/privacy-policy#cookies">Learn more about cookies</a>
    </p>
    <div class="cookie-consent-actions">
      <button type="button" class="cookie-consent-accept" data-cookie-consent="granted">Accept</button>
      <button type="button" class="cookie-consent-decline" data-cookie-consent="denied">Decline</button>
    </div>
  </div>
</div>
