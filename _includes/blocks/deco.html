{%- comment -%}

  graphic, so the planets start on that side, clear of the heading.
{%- endcomment -%}

  <svg viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="190" class="ring"/>
    <circle cx="200" cy="200" r="118" class="ring"/>
    <circle cx="200" cy="200" r="11" fill="#FFBA42" opacity=".55"/>
    <circle cx="183.4" cy="389.3" r="7" fill="#FFBA42"/>
    <circle cx="83.8" cy="179.5" r="5" fill="#E8ECF8" opacity=".8"/>
  </svg>
</div>
