{%- comment -%}
  Rails release series and whether each still gets security fixes, from
  _data/rails_versions.yml. Sits beside a text band's prose (text-band.html
  with aside="version-panel").
{%- endcomment -%}
{%- assign versions = site.data.rails_versions -%}
<figure class="version-panel" data-reveal="rise" style="--d:.2s">
  <figcaption>
    <span class="version-panel-title">Rails support today</span>
    <span class="version-panel-latest">Latest: {{ versions.latest }}</span>
  </figcaption>
  <ul>
    {%- for series in versions.series %}
    <li class="is-{{ series.status }}">
      <span class="version-name">{{ series.name }}</span>
      <span class="version-status">{{ series.label }}</span>
      <dl class="version-support">
        <div><dt>Bug fixes</dt><dd>{{ series.bug_fixes }}</dd></div>
        <div><dt>Security fixes</dt><dd>{{ series.security }}</dd></div>
      </dl>
    </li>
    {%- endfor %}
  </ul>
  <p class="version-panel-source">Checked {{ versions.checked | date: "%B %-d, %Y" }} against the <a href="https://rubyonrails.org/maintenance" target="_blank" rel="noopener">Rails maintenance policy</a>.</p>
</figure>
